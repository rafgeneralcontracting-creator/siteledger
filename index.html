<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><title>SiteLedger</title><style>
:root{--ink:#101828;--muted:#667085;--line:#e4e7ec;--bg:#f6f8fb;--nav:#101828;--blue:#275efe;--green:#067647;--greenbg:#ecfdf3;--amber:#b54708;--amberbg:#fff6ed;--red:#b42318;--redbg:#fef3f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;background:var(--nav);color:#fff;z-index:20}.topin{max-width:920px;margin:auto;height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.sub{font-size:12px;color:#98a2b3}.wrap{max-width:920px;margin:auto;padding:20px 14px 100px}.hero h1{margin:5px 0;font-size:28px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#667085}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 1px 2px rgba(16,24,40,.03)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:17px;font-weight:850}.small{font-size:13px;color:var(--muted);margin-top:4px}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid #d0d5dd;color:var(--ink)}.block{width:100%}.badge{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}.done{background:var(--greenbg);color:var(--green)}.due{background:var(--amberbg);color:var(--amber)}.past{background:var(--redbg);color:var(--red)}.up{background:#f2f4f7;color:#475467}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}.metric b{display:block;font-size:22px}.metric span{font-size:11px;color:var(--muted)}.section{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#667085;margin:22px 2px 8px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}.field textarea{min-height:100px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:11px 12px;border-radius:11px;margin:10px 0;font-size:13px}.error{background:var(--redbg);color:var(--red)}.success{background:var(--greenbg);color:var(--green)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30}.navin{max-width:920px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;border:0;padding:12px 4px;font-size:11px;font-weight:800;color:#667085}.nav button.active{color:var(--blue)}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#101828,#1d2939)}.authcard{width:min(450px,100%);background:#fff;border-radius:20px;padding:24px}.authcard h1{margin:5px 0}.modal{position:fixed;inset:0;background:#10182899;z-index:50;display:grid;place-items:end center}.sheet{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px}.inline{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;background:#fafafa}.actions{display:flex;gap:8px}.actions>*{flex:1}.hidden{display:none}.click{cursor:pointer}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.wrap{padding-top:16px}}
</style></head><body><div id="app"></div><script>
const SB='https://zgigfgtujebjvoehbrar.supabase.co',KEY='sb_publishable_kmK4_KhS2_erhEw9Sb07uA_N2mOFJKm',app=document.getElementById('app');const A='sl_access',R='sl_refresh';let token=localStorage.getItem(A)||'',refresh=localStorage.getItem(R)||'',me=null,org=null,screen='home',projectId=null,reportId=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const iso=d=>d.toISOString().slice(0,10),today=iso(new Date());function monday(){let d=new Date(),n=d.getDay();d.setDate(d.getDate()+(n===0?-6:1-n));return d}const week=[0,1,2,3,4].map(n=>{let d=monday();d.setDate(d.getDate()+n);return iso(d)});function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
async function api(path,opt={}){let r=await fetch(SB+path,{...opt,headers:{apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})}}),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.msg||d.message||d.error_description||d.error||('Request failed '+r.status));return d}function save(d){if(d.access_token){token=d.access_token;localStorage.setItem(A,token)}if(d.refresh_token){refresh=d.refresh_token;localStorage.setItem(R,refresh)}}async function rest(path,opt={}){try{return await api('/rest/v1/'+path,{...opt,headers:{Authorization:'Bearer '+token,Prefer:'return=representation',...(opt.headers||{})}})}catch(e){if(refresh&&e.message.toLowerCase().includes('jwt')){let d=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:refresh})});save(d);return rest(path,opt)}throw e}}
function auth(msg=''){app.innerHTML='<div class="auth"><div class="authcard"><div class="eyebrow">SiteLedger</div><h1>Construction field management.</h1><div class="small">Sign in to continue.</div>'+msg+'<div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary block" onclick="signin()">Sign In</button></div></div>'}async function signin(){try{let d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});save(d);boot()}catch(e){auth('<div class="notice error">'+esc(e.message)+'</div>')}}function logout(){localStorage.clear();location.reload()}
async function boot(){try{let ps=await rest('profiles?select=*&limit=1');if(!ps.length)throw Error('No SiteLedger profile found.');me=ps[0];org=(await rest('organizations?select=*&id=eq.'+me.organization_id))[0];go('home')}catch(e){auth('<div class="notice error">'+esc(e.message)+'</div>')}}
function shell(body,active=screen){app.innerHTML='<div class="top"><div class="topin"><div><div class="brand">SiteLedger</div><div class="sub">'+esc(org?.name||'')+'</div></div><div class="sub">'+esc(me?.full_name||'')+'</div></div></div><div class="wrap">'+body+'</div><div class="nav"><div class="navin"><button class="'+(active==='home'?'active':'')+'" onclick="go(\'home\')">Home</button><button class="'+(active==='logs'?'active':'')+'" onclick="go(\'logs\')">Daily Logs</button><button class="'+(active==='projects'?'active':'')+'" onclick="go(\'projects\')">Projects</button><button onclick="logout()">Sign Out</button></div></div>'}
window.go=async(s,id)=>{screen=s;if(s==='project')projectId=id;if(s==='report')reportId=id;try{if(s==='home')await home();else if(s==='logs')await logs();else if(s==='projects')await projectsPage();else if(s==='project')await projectPage();else if(s==='report')await reportPage()}catch(e){shell('<div class="notice error">'+esc(e.message)+'</div>')}};async function projects(){return rest('projects?select=*&active=eq.true&order=name')}async function reports(pid=''){return rest('daily_reports?select=*'+(pid?'&project_id=eq.'+pid:'')+'&order=log_date.desc')}function stat(r){if(r.submitted)return['Submitted','done'];if(r.log_date>today)return['Upcoming','up'];if(r.log_date===today)return['Due Today','due'];return['Past Due','past']}
async function ensureWeek(p){let rs=await reports(p.id);for(let d of week)if(!rs.some(r=>r.log_date===d)){try{await rest('daily_reports',{method:'POST',body:JSON.stringify({project_id:p.id,log_date:d,created_by:me.id})})}catch(e){}}}
async function home(){let ps=await projects();for(let p of ps)await ensureWeek(p);let rs=await reports(),due=rs.filter(r=>!r.submitted&&r.log_date===today).length,past=rs.filter(r=>!r.submitted&&r.log_date<today).length,sub=rs.filter(r=>r.submitted&&week.includes(r.log_date)).length;let cards=ps.map(p=>'<div class="card click" onclick="go(\'project\',\''+p.id+'\')"><div class="row"><div><div class="title">'+esc(p.name)+'</div><div class="small">'+esc(p.address||'')+'</div></div><button class="btn secondary">Open</button></div></div>').join('');shell('<div class="hero"><div class="eyebrow">Company Overview</div><h1>Welcome, '+esc(me.full_name.split(' ')[0])+'.</h1><div class="small">Here is what needs attention across your jobsites.</div></div><div class="metrics"><div class="metric"><b>'+ps.length+'</b><span>Projects</span></div><div class="metric"><b>'+due+'</b><span>Due Today</span></div><div class="metric"><b>'+past+'</b><span>Past Due</span></div><div class="metric"><b>'+sub+'</b><span>Submitted</span></div></div><div class="section">Active Projects</div>'+cards+(ps.length?'':'<div class="card"><div class="title">No projects yet</div><div class="small">Create your first project to begin field reporting.</div></div>'),'home')}
async function projectsPage(){let ps=await projects(),can=['owner','admin'].includes(me.role);shell('<div class="row"><div><div class="eyebrow">Jobsites</div><h1>Projects</h1></div>'+(can?'<button class="btn primary" onclick="projectForm()">+ Add Project</button>':'')+'</div>'+ps.map(p=>'<div class="card click" onclick="go(\'project\',\''+p.id+'\')"><div class="title">'+esc(p.name)+'</div><div class="small">'+esc(p.address||'No address')+'</div></div>').join(''),'projects')}
function modal(x){document.body.insertAdjacentHTML('beforeend','<div id="modal" class="modal"><div class="sheet">'+x+'</div></div>')}function closeModal(){document.getElementById('modal')?.remove()}function projectForm(){modal('<h2>Create Project</h2><div class="field"><label>Project Name</label><input id="pn"></div><div class="field"><label>Address</label><input id="pa"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createProject()">Create</button></div>')}async function createProject(){let n=pn.value.trim();if(!n)return alert('Enter a project name');let x=await rest('projects',{method:'POST',body:JSON.stringify({organization_id:me.organization_id,name:n,address:pa.value.trim()||null,status:'active',active:true})});closeModal();go('project',x[0].id)}
async function projectPage(){let ps=await projects(),p=ps.find(x=>x.id===projectId);if(!p)throw Error('Project not found');await ensureWeek(p);let rs=await reports(p.id);shell('<button class="btn secondary" onclick="go(\'projects\')">← Projects</button><div class="hero"><div class="eyebrow">Project</div><h1>'+esc(p.name)+'</h1><div class="small">'+esc(p.address||'')+'</div></div><div class="section">This Week</div>'+week.map(d=>{let r=rs.find(x=>x.log_date===d);if(!r)return'';let s=stat(r);return '<div class="card click" onclick="go(\'report\',\''+r.id+'\')"><div class="row"><div><div class="title">'+fmt(d)+'</div><div class="small">Daily field report</div></div><span class="badge '+s[1]+'">'+s[0]+'</span></div></div>'}).join(''),'projects')}
async function logs(){let ps=await projects();for(let p of ps)await ensureWeek(p);let rs=await reports(),html='';for(let p of ps){html+='<div class="section">'+esc(p.name)+'</div>'+rs.filter(r=>r.project_id===p.id&&week.includes(r.log_date)).sort((a,b)=>a.log_date.localeCompare(b.log_date)).map(r=>{let s=stat(r);return '<div class="card click" onclick="go(\'report\',\''+r.id+'\')"><div class="row"><div><div class="title">'+fmt(r.log_date)+'</div><div class="small">'+esc(p.name)+'</div></div><span class="badge '+s[1]+'">'+s[0]+'</span></div></div>'}).join('')}shell('<div class="hero"><div class="eyebrow">Field Reporting</div><h1>Daily Logs</h1><div class="small">Open current or past-due reports.</div></div>'+html,'logs')}
async function child(t,id){return rest(t+'?select=*&daily_report_id=eq.'+id)}async function reportPage(){let r=(await rest('daily_reports?select=*&id=eq.'+reportId))[0];if(!r)throw Error('Report not found');let p=(await projects()).find(x=>x.id===r.project_id),mp=await child('manpower',r.id),dl=await child('deliveries',r.id),iss=await child('issues',r.id),ro=r.submitted||r.log_date>today,s=stat(r);let manpower=mp.map(x=>'<div class="inline"><b>'+esc(x.trade)+'</b><div class="small">'+x.worker_count+' workers · '+x.regular_hours+' hrs</div></div>').join(''),deliveries=dl.map(x=>'<div class="inline"><b>'+esc(x.vendor||'Delivery')+'</b><div class="small">'+esc(x.material_equipment||'')+'</div></div>').join(''),issues=iss.map(x=>'<div class="inline"><b>'+esc(x.type||'Issue')+'</b><div class="small">'+esc(x.description||'')+'</div></div>').join('');shell('<button class="btn secondary" onclick="go(\'project\',\''+r.project_id+'\')">← Back</button><div class="hero"><div class="eyebrow">Daily Field Report</div><h1>'+fmt(r.log_date)+'</h1><div class="small">'+esc(p?.name||'')+'</div><div style="margin-top:9px"><span class="badge '+s[1]+'">'+s[0]+'</span></div></div><div class="card"><div class="row"><div><b>No Work Today</b><div class="small">Use only when no work occurred.</div></div><input type="checkbox" '+(r.no_work_today?'checked':'')+' '+(ro?'disabled':'')+' onchange="savePatch({no_work_today:this.checked})"></div></div><div class="'+(r.no_work_today?'hidden':'')+'"><div class="section">Work Performed</div><div class="card"><div class="field"><label>Weather</label><input '+(ro?'disabled':'')+' value="'+esc(r.weather||'')+'" onchange="savePatch({weather:this.value})"></div><div class="field"><label>Work Performed</label><textarea '+(ro?'disabled':'')+' onchange="savePatch({work_performed:this.value})">'+esc(r.work_performed||'')+'</textarea></div><div class="field"><label>Areas / Floors</label><input '+(ro?'disabled':'')+' value="'+esc(r.areas_floors||'')+'" onchange="savePatch({areas_floors:this.value})"></div><div class="field"><label>General Conditions</label><textarea '+(ro?'disabled':'')+' onchange="savePatch({general_conditions:this.value})">'+esc(r.general_conditions||'')+'</textarea></div></div><div class="section">Manpower</div><div class="card">'+manpower+(ro?'':'<button class="btn secondary block" onclick="manpowerForm()">+ Add Manpower</button>')+'</div><div class="section">Deliveries</div><div class="card">'+deliveries+(ro?'':'<button class="btn secondary block" onclick="deliveryForm()">+ Add Delivery</button>')+'</div><div class="section">Field Issues</div><div class="card">'+issues+(ro?'':'<button class="btn secondary block" onclick="issueForm()">+ Add Issue</button>')+'</div><div class="section">Closeout</div><div class="card"><div class="field"><label>Delays / Impacts</label><textarea '+(ro?'disabled':'')+' onchange="savePatch({delays_impacts:this.value})">'+esc(r.delays_impacts||'')+'</textarea></div><div class="field"><label>Visitors / Inspections</label><textarea '+(ro?'disabled':'')+' onchange="savePatch({visitors_inspections:this.value})">'+esc(r.visitors_inspections||'')+'</textarea></div><div class="field"><label>Safety Notes</label><textarea '+(ro?'disabled':'')+' onchange="savePatch({safety_notes:this.value})">'+esc(r.safety_notes||'')+'</textarea></div><div class="field"><label>Tomorrow\'s Plan</label><textarea '+(ro?'disabled':'')+' onchange="savePatch({tomorrow_plan:this.value})">'+esc(r.tomorrow_plan||'')+'</textarea></div></div></div>'+(r.submitted?'<div class="notice success">Submitted and locked.</div>':r.log_date>today?'<div class="notice error">Upcoming report is view-only.</div>':'<button class="btn primary block" onclick="submitReport()">Submit Daily Report</button>'),'logs')}
async function savePatch(x){await rest('daily_reports?id=eq.'+reportId,{method:'PATCH',body:JSON.stringify({...x,updated_at:new Date().toISOString()})})}function manpowerForm(){modal('<h2>Add Manpower</h2><div class="field"><label>Trade</label><input id="mt"></div><div class="grid2"><div class="field"><label>Workers</label><input id="mw" type="number"></div><div class="field"><label>Hours</label><input id="mh" type="number" value="8"></div></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addManpower()">Save</button></div>')}async function addManpower(){if(!mt.value.trim())return alert('Enter trade');await rest('manpower',{method:'POST',body:JSON.stringify({daily_report_id:reportId,trade:mt.value.trim(),worker_count:+mw.value||0,regular_hours:+mh.value||0})});closeModal();reportPage()}function deliveryForm(){modal('<h2>Add Delivery</h2><div class="field"><label>Vendor</label><input id="dv"></div><div class="field"><label>Material / Equipment</label><input id="dm"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addDelivery()">Save</button></div>')}async function addDelivery(){await rest('deliveries',{method:'POST',body:JSON.stringify({daily_report_id:reportId,delivery_at:new Date().toISOString(),vendor:dv.value.trim()||null,material_equipment:dm.value.trim()||null})});closeModal();reportPage()}function issueForm(){modal('<h2>Add Field Issue</h2><div class="field"><label>Type</label><select id="it"><option>Coordination</option><option>Safety</option><option>Quality</option><option>Schedule</option></select></div><div class="field"><label>Description</label><textarea id="idsc"></textarea></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addIssue()">Save</button></div>')}async function addIssue(){await rest('issues',{method:'POST',body:JSON.stringify({daily_report_id:reportId,type:it.value,description:idsc.value.trim()||null,status:'Open'})});closeModal();reportPage()}async function submitReport(){if(!confirm('Submit and lock this report?'))return;await savePatch({submitted:true,submitted_at:new Date().toISOString()});reportPage()}
Object.assign(window,{signin,logout,go,projectForm,createProject,closeModal,savePatch,manpowerForm,addManpower,deliveryForm,addDelivery,issueForm,addIssue,submitReport});if(token)boot();else auth();
</script></body></html>
