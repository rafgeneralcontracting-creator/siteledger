async function daily(){let ps=await projects();for(let p of ps)await ensureWeek(p);let rs=await reports(),h=`<div class="hero"><div class="eyebrow">Field reporting</div><h1>This Week</h1><p>${fmt(wk[0])} – ${fmt(wk[4])}</p></div>`;for(let p of ps){h+=`<div class="section">${esc(p.name)}</div>`;for(let d of wk){let r=rs.find(x=>x.project_id===p.id&&x.log_date===d);if(r){let s=stat(r);h+=`<div class="card click" onclick="go('report','${r.id}')"><div class="row"><div><div class="title">${fmt(d)}</div><div class="small">${esc(p.name)}</div></div><span class="badge ${s[1]}">${s[0]}</span></div></div>`}}}app.innerHTML=shell('Daily Logs','daily',h||'<div class="empty">No projects.</div>')}async function projectView(){let p=(await projects()).find(x=>x.id===route.p);if(!p)throw Error('Project not found.');await ensureWeek(p);let rs=await reports(p.id),r=rs.find(x=>x.log_date===iso(today)),s=r?stat(r):['Not Started','up'];app.innerHTML=shell('Project','projects',`<div class="hero"><div class="eyebrow">Project</div><h1>${esc(p.name)}</h1><p>${esc(p.address||'')}</p></div><div class="card"><div class="row"><div><div class="title">Today's Report</div><div class="small">${fmt(iso(today))}</div></div><span class="badge ${s[1]}">${s[0]}</span></div>${r?`<button class="btn primary block" style="margin-top:14px" onclick="go('report','${r.id}')">${r.submitted?'View':'Open'} Today's Report</button>`:''}</div><div class="section">This Week</div>${rs.filter(x=>wk.includes(x.log_date)).map(x=>{let st=stat(x);return `<div class="card click" onclick="go('report','${x.id}')"><div class="row"><div><div class="title">${fmt(x.log_date)}</div><div class="small">Daily field report</div></div><span class="badge ${st[1]}">${st[0]}</span></div></div>`}).join('')}`)}async function reportOne(){return (await rest(`daily_reports?select=*&id=eq.${route.r}`))[0]}async function upd(o){await rest(`daily_reports?id=eq.${route.r}`,{method:'PATCH',body:JSON.stringify({...o,updated_at:new Date().toISOString()})})}window.saveField=(k,v)=>upd({[k]:v});window.toggleNW=async()=>{let r=await reportOne();await upd({no_work_today:!r.no_work_today});reportView()};async function reportView(){let r=await reportOne();if(!r)throw Error('Report not found.');let p=(await projects()).find(x=>x.id===r.project_id),mp=await child('manpower',r.id),ph=await child('photos',r.id),dl=await child('deliveries',r.id),iss=await child('issues',r.id),future=r.log_date>iso(today),ro=r.submitted||future,s=stat(r),checks={work:r.no_work_today||!!(r.work_performed||'').trim(),mp:r.no_work_today||mp.length>0,ph:r.no_work_today||ph.length>0,sig:r.no_work_today||!!r.signature_path},ready=Object.values(checks).every(Boolean);let field=(lab,k,v,ta=false)=>`<div class="field"><label>${lab}</label>${ta?`<textarea ${ro?'disabled':''} onchange="saveField('${k}',this.value)">${esc(v||'')}</textarea>`:`<input ${ro?'disabled':''} value="${esc(v??'')}" onchange="saveField('${k}',this.value)">`}</div>`,urls=await Promise.all(ph.map(async x=>{let u='';try{u=await photoUrl(x.storage_path)}catch(e){}return `<div class="photo">${u?`<img src="${u}">`:''}<div>${esc(x.caption||'Progress photo')}<br><span class="small">${esc(x.area_floor||'')}</span></div></div>`}));app.innerHTML=shell('Daily Report','',`<div class="hero"><div class="eyebrow">Daily Field Report</div><h1>${fmt(r.log_date)}</h1><p>${esc(p?.name||'Project')}</p><div style="margin-top:10px"><span class="badge ${s[1]}">${s[0]}</span></div></div>${future?note('This report is upcoming and view-only until the report date.','info'):''}<div class="section">Report Details</div><div class="card"><div class="field"><label>Created By</label><input value="${esc(profile.full_name)}" disabled></div><div class="row"><div><div class="title" style="font-size:15px">No Work Today</div><div class="small">Use when there was no site activity.</div></div><div class="switch ${r.no_work_today?'on':''}" onclick="${ro?'':'toggleNW()'}"><span></span></div></div></div><div class="${r.no_work_today?'hidden':''}"><div class="section">Site Conditions</div><div class="card">${field('Weather','weather',r.weather)}<div class="grid2">${field('High Temp','high_temp',r.high_temp)}${field('Low Temp','low_temp',r.low_temp)}</div>${field('General Conditions','general_conditions',r.general_conditions,true)}</div><div class="section">Work & Manpower</div><div class="card">${field('Work Performed','work_performed',r.work_performed,true)}${field('Areas / Floors','areas_floors',r.areas_floors)}${mp.map(m=>`<div class="inline"><div class="inlinehead"><span>${esc(m.trade)}</span><span>${m.worker_count} workers</span></div><div class="small">${m.regular_hours} hrs${m.foreman?' · '+esc(m.foreman):''}</div></div>`).join('')}${ro?'':`<button class="btn secondary block" onclick="manpowerForm()">+ Add Manpower</button>`}</div><div class="section">Photos & Deliveries</div><div class="card"><div class="photoGrid">${urls.join('')}</div>${ro?'':`<button class="btn secondary block" style="margin-top:10px" onclick="photoForm()">+ Add Progress Photo</button>`}${dl.map(d=>`<div class="inline"><div class="inlinehead"><span>${esc(d.vendor||'Delivery')}</span><span>${esc(d.quantity||'')}</span></div><div class="small">${esc(d.material_equipment||'')}</div></div>`).join('')}${ro?'':`<button class="btn secondary block" style="margin-top:8px" onclick="deliveryForm()">+ Add Delivery</button>`}</div><div class="section">Issues & Next Day</div><div class="card">${field('Delays / Impacts','delays_impacts',r.delays_impacts,true)}${field('Visitors / Inspections','visitors_inspections',r.visitors_inspections,true)}${field('Safety Notes','safety_notes',r.safety_notes,true)}${iss.map(i=>`<div class="inline"><div class="inlinehead"><span>${esc(i.type||'Issue')}</span><span>${esc(i.severity||'')}</span></div><div>${esc(i.description||'')}</div></div>`).join('')}${ro?'':`<button class="btn secondary block" onclick="issueForm()">+ Report Issue</button>`}${field("Tomorrow's Plan",'tomorrow_plan',r.tomorrow_plan,true)}</div><div class="section">Signature</div><div class="card">${r.signature_path?note('✓ Superintendent signature captured.','success'):ro?'<div class="small">No signature captured.</div>':`<div class="field"><label>Type your full name to sign</label><input id="sigName" value="${esc(profile.full_name)}"></div><button class="btn secondary block" onclick="signReport()">Sign Report</button>`}</div></div><div class="section">Submit Report</div><div class="card">${r.no_work_today?`<div class="req"><span>No Work Today</span><span class="ok">✓ Ready</span></div>`:`<div class="req"><span>Work Performed</span><span class="${checks.work?'ok':'miss'}">${checks.work?'✓ Complete':'Missing'}</span></div><div class="req"><span>Manpower</span><span class="${checks.mp?'ok':'miss'}">${checks.mp?'✓ Complete':'Missing'}</span></div><div class="req"><span>Progress Photo</span><span class="${checks.ph?'ok':'miss'}">${checks.ph?'✓ Complete':'Missing'}</span></div><div class="req"><span>Signature</span><span class="${checks.sig?'ok':'miss'}">${checks.sig?'✓ Complete':'Missing'}</span></div>`}</div>${r.submitted?note('This report is submitted and locked.','success')+`<button class="btn secondary block" onclick="window.print()">Print / Save PDF</button>`:future?'':`<button class="btn primary block" ${ready?'':'disabled'} onclick="${ready?'submitReport()':''}">Submit Daily Report</button>`}`)}async function signReport(){let n=$('sigName').value.trim();if(!n)return alert('Enter your name.');await upd({signature_path:n+' · '+new Date().toISOString()});reportView()}async function submitReport(){if(!confirm('Submit this report? It will become read-only.'))return;await upd({submitted:true,submitted_at:new Date().toISOString()});reportView()}
function manpowerForm(){modal(`<h3>Add Manpower</h3><div class="field"><label>Trade</label><input id="mt"></div><div class="grid2"><div class="field"><label>Workers</label><input id="mw" type="number" min="0"></div><div class="field"><label>Hours</label><input id="mh" type="number" value="8"></div></div><div class="field"><label>Foreman</label><input id="mf"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveMP()">Save</button></div>`)}async function saveMP(){let t=$('mt').value.trim();if(!t)return alert('Enter a trade.');await rest('manpower',{method:'POST',body:JSON.stringify({daily_report_id:route.r,trade:t,worker_count:+$('mw').value||0,regular_hours:+$('mh').value||0,foreman:$('mf').value.trim()||null})});closeModal();reportView()}function deliveryForm(){modal(`<h3>Add Delivery</h3><div class="field"><label>Vendor</label><input id="dv"></div><div class="field"><label>Material / Equipment</label><input id="dm"></div><div class="field"><label>Quantity</label><input id="dq"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDel()">Save</button></div>`)}async function saveDel(){await rest('deliveries',{method:'POST',body:JSON.stringify({daily_report_id:route.r,delivery_at:new Date().toISOString(),vendor:$('dv').value.trim()||null,material_equipment:$('dm').value.trim()||null,quantity:$('dq').value.trim()||null})});closeModal();reportView()}function issueForm(){modal(`<h3>Report Field Issue</h3><div class="grid2"><div class="field"><label>Type</label><select id="it"><option>Coordination</option><option>Safety</option><option>Quality</option><option>Schedule</option><option>Site Condition</option></select></div><div class="field"><label>Severity</label><select id="is"><option>Low</option><option>Medium</option><option>High</option></select></div></div><div class="field"><label>Description</label><textarea id="id"></textarea></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveIssue()">Save</button></div>`)}async function saveIssue(){await rest('issues',{method:'POST',body:JSON.stringify({daily_report_id:route.r,type:$('it').value,severity:$('is').value,description:$('id').value.trim()||null,status:'Open'})});closeModal();reportView()}function photoForm(){modal(`<h3>Add Progress Photo</h3><div class="field"><label>Photo</label><input id="pf" type="file" accept="image/*" capture="environment"></div><div class="field"><label>Caption</label><input id="pc"></div><div class="field"><label>Area / Floor</label><input id="pr"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePhoto()">Upload</button></div>`)}async function savePhoto(){let f=$('pf').files?.[0];if(!f)return alert('Choose a photo.');let path=`${profile.organization_id}/${route.r}/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,res=await fetch(`${SB}/storage/v1/object/report-photos/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':f.type||'application/octet-stream'},body:f});if(!res.ok)return alert('Photo upload failed.');await rest('photos',{method:'POST',body:JSON.stringify({daily_report_id:route.r,storage_path:path,caption:$('pc').value.trim()||null,area_floor:$('pr').value.trim()||null,uploaded_by:profile.id})});closeModal();reportView()}async function photoUrl(path){let res=await fetch(`${SB}/storage/v1/object/sign/report-photos/${encodeURIComponent(path).replace(/%2F/g,'/')}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});if(!res.ok)return'';let d=await res.json();return d.signedURL?SB+'/storage/v1'+d.signedURL:''}
async function historyView(){let ps=await projects(),rs=(await reports()).filter(r=>r.submitted||r.log_date<wk[0]).sort((a,b)=>b.log_date.localeCompare(a.log_date));app.innerHTML=shell('History','history',`<div class="hero"><div class="eyebrow">Archive</div><h1>Report History</h1><p>Submitted and previous daily reports.</p></div>${rs.map(r=>{let p=ps.find(x=>x.id===r.project_id),s=stat(r);return `<div class="card click" onclick="go('report','${r.id}')"><div class="row"><div><div class="title">${fmt(r.log_date)}</div><div class="small">${esc(p?.name||'Project')}</div></div><span class="badge ${s[1]}">${s[0]}</span></div></div>`}).join('')||'<div class="card empty">No history yet.</div>'}`)}const roleName=r=>({owner:'Owner',admin:'Admin',pm:'Project Manager',apm:'Assistant Project Manager',super:'Site Superintendent'}[r]||r);async function team(){if(!['owner','admin'].includes(profile.role))return home();let people=await rest('profiles?select=id,full_name,role,active&order=full_name'),ps=await projects(),inv=await rest('company_invites?select=*&used_at=is.null&order=created_at.desc');app.innerHTML=shell('Team','team',`<div class="hero"><div class="eyebrow">Access Control</div><h1>Team</h1><p>Invite staff and assign them to projects.</p></div><button class="btn primary block" style="margin-top:16px" onclick="inviteForm()">+ Invite Team Member</button><div class="section">Users</div>${people.map(x=>`<div class="card"><div class="row"><div><div class="title">${esc(x.full_name)}</div><div class="small">${roleName(x.role)}</div></div><span class="badge done">Active</span></div></div>`).join('')}<div class="section">Pending Invites</div>${inv.map(x=>{let p=ps.find(z=>z.id===x.project_id),link=location.origin+location.pathname+'?invite='+x.token;return `<div class="card"><div class="title">${esc(x.email)}</div><div class="small">${roleName(x.role)}${p?' · '+esc(p.name):''}</div><button class="btn secondary block" style="margin-top:10px" onclick="navigator.clipboard.writeText('${link}');alert('Invite link copied.')">Copy Invite Link</button></div>`}).join('')||'<div class="card empty">No pending invitations.</div>'}`)}async function inviteForm(){let ps=await projects();modal(`<h3>Invite Team Member</h3><div class="field"><label>Email</label><input id="ie" type="email"></div><div class="field"><label>Role</label><select id="ir"><option value="super">Site Superintendent</option><option value="apm">Assistant Project Manager</option><option value="pm">Project Manager</option><option value="admin">Admin</option></select></div><div class="field"><label>Project</label><select id="ip"><option value="">No project yet</option>${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="makeInvite()">Create Invite</button></div>`)}async function makeInvite(){let e=$('ie').value.trim();if(!e)return alert('Enter an email.');let b={organization_id:profile.organization_id,email:e,role:$('ir').value,created_by:profile.id};if($('ip').value)b.project_id=$('ip').value;let x=(await rest('company_invites',{method:'POST',body:JSON.stringify(b)}))[0],link=location.origin+location.pathname+'?invite='+x.token;closeModal();modal(`<h3>Invite Ready</h3>${note('Send this link to '+e,'success')}<div class="field"><label>Invite Link</label><input id="il" value="${esc(link)}" readonly></div><button class="btn primary block" onclick="navigator.clipboard.writeText($('il').value);alert('Copied.')">Copy Link</button>`)}
Object.assign(window,{welcome,signupForm,signinForm,signup,signin,logout,projectForm,createProject,closeModal,manpowerForm,saveMP,deliveryForm,saveDel,issueForm,saveIssue,photoForm,savePhoto,signReport,submitReport,inviteForm,makeInvite});window.addEventListener('error',e=>{if(!app.innerHTML.trim())app.innerHTML=`<div class="page">${note('SiteLedger startup error: '+e.message)}</div>`});try{token?boot():welcome()}catch(e){app.innerHTML=`<div class="page">${note('SiteLedger startup error: '+e.message)}</div>`}
</script></body></html>
