const SB='https://zgigfgtujebjvoehbrar.supabase.co',KEY='sb_publishable_kmK4_KhS2_erhEw9Sb07uA_N2mOFJKm',app=document.getElementById('app');let token=localStorage.getItem('sl_access')||'',refresh=localStorage.getItem('sl_refresh')||'',profile=null,org=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function call(path,opt={}){let r=await fetch(SB+path,{...opt,headers:{apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})}}),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.message||d.error_description||d.error||'Request failed');return d}async function rest(path,opt={}){return call('/rest/v1/'+path,{...opt,headers:{Authorization:'Bearer '+token,Prefer:'return=representation',...(opt.headers||{})}})}function layout(body){app.innerHTML='<div class="top"><b>SiteLedger</b><div style="font-size:12px;opacity:.7">'+esc(org?.name||'Construction Field Management')+'</div></div><div class="wrap"><div class="nav"><button class="btn secondary" onclick="home()">Home</button><button class="btn secondary" onclick="daily()">Daily Logs</button><button class="btn secondary" onclick="projectList()">Projects</button><button class="btn secondary" onclick="logout()">Sign Out</button></div>'+body+'</div>'}function logout(){localStorage.removeItem('sl_access');localStorage.removeItem('sl_refresh');location.reload()}async function boot(){try{let ps=await rest('profiles?select=*&limit=1');if(!ps.length)throw Error('Profile not found');profile=ps[0];org=(await rest('organizations?select=*&id=eq.'+profile.organization_id))[0];home()}catch(e){app.innerHTML='<div class="wrap"><div class="error">'+esc(e.message)+'</div><button class="btn" onclick="logout()">Sign in again</button></div>'}}async function projects(){return rest('projects?select=*&active=eq.true&order=name')}async function reports(pid=''){return rest('daily_reports?select=*'+(pid?'&project_id=eq.'+pid:'')+'&order=log_date.desc')}async b><div class="muted">'+esc(p?.name||'')+'</div></div><button class="btn" onclick="openReport(\''+r.id+'\')">'+(r.submitted?'View':'Open')+' Report</button></div></div>'}async function daily(){let ps=await projects(),rs=await reports(),html='<h1>Daily Logs</h1>';for(let p of ps){html+='<h3>'+esc(p.name)+'</h3>'+rs.filter(r=>r.project_id===p.id).map(r=>reportCard(r,p)).join('')}layout(html)}async function openReport(id){try{let r=(await rest('daily_reports?select=*&id=eq.'+id))[0];if(!r)throw Error('Report not found');let p=(await projects()).find(x=>x.id===r.project_id);layout('<button class="btn secondary" onclick="projectView(\''+r.project_id+'\')">← Back</button><h1>Daily Report</h1><div class="muted">'+esc(p?.name||'')+' · '+esc(r.log_date)+'</div><div class="card">'+(r.submitted?'<div class="ok">Submitted and locked</div>':'')+'<div class="field"><label>Weather</label><input id="weather" '+(r.submitted?'disabled':'')+' value="'+esc(r.weather||'')+'"></div><div class="field"><label>Work Performed</label><textarea id="work" '+(r.submitted?'disabled':'')+'>'+esc(r.work_performed||'')+'</textarea></div><div class="field"><label>Areas / Floors</label><input id="areas" '+(r.submitted?'disabled':'')+' value="'+esc(r.areas_floors||'')+'"></div><div class="field"><label>General Conditions</label><textarea id="conditions" '+(r.submitted?'disabled':'')+'>'+esc(r.general_conditions||'')+'</textarea></div>'+(r.submitted?'':'<button class="btn" onclick="saveReport(\''+r.id+'\')">Save Report</button>')+'</div><div class="card"><b>Next build step</b><div class="muted">Manpower, photos, deliveries, issues, signature and submit/lock remain connected to the existing backend and will be restored after this report-navigation fix is confirmed.</div></div>')}catch(e){layout('<div class="error">'+esc(e.message)+'</div>')}}async function saveReport(id){await rest('daily_reports?id=eq.'+id,{method:'PATCH',body:JSON.stringify({weather:document.getElementById('weather').value,work_performed:document.getElementById('work').value,areas_floors:document.getElementById('areas').value,general_conditions:document.getElementById('conditions').value,updated_at:new Date().toISOString()})});openReport(id)}Object.assign(window,{home,daily,projectList,projectForm,createProject,projectView,openReport,saveReport,logout});if(token)boot();else app.innerHTML='<div class="wrap"><div class="error">Your saved session is missing. Please return to the prior sign-in page or clear SiteLedger site data and sign in again.</div></div>';
</script></body></html>
