<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteLedger</title>
<style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;margin:0}.wrap{max-width:480px;margin:60px auto;padding:18px}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:22px}h1{margin:5px 0 8px}.sub{color:#64748b;margin-bottom:18px}.field{margin:12px 0}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#0f172a;color:white}.secondary{background:white;border:1px solid #cbd5e1;margin-top:9px}.msg{padding:11px;border-radius:10px;background:#fef2f2;color:#991b1b;margin:10px 0}.good{background:#f0fdf4;color:#166534}.project{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:9px 0}</style></head><body><div id="app"></div>
<script>
const URL="https://zgigfgtujebjvoehbrar.supabase.co", KEY="sb_publishable_kmK4_KhS2_erhEw9Sb07uA_N2mOFJKm", app=document.getElementById("app");
const wrap=x=>app.innerHTML='<div class="wrap">'+x+'</div>', card=x=>'<div class="card">'+x+'</div>', msg=(x,c="")=>'<div class="msg '+c+'">'+x+'</div>';
function welcome(){wrap(card('<b>SITELEDGER</b><h1>Construction field management.</h1><div class="sub">Create your company account or sign in.</div><button class="btn primary" onclick="signupForm()">Create Company Account</button><button class="btn secondary" onclick="signinForm()">Sign In</button>'))}
function signupForm(m=""){wrap(card('<b>CREATE COMPANY ACCOUNT</b><h1>Set up SiteLedger</h1><div class="sub">The first user becomes the company Owner.</div>'+m+'<div class="field"><label>Your Name</label><input id="name"></div><div class="field"><label>Company Name</label><input id="company"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="signup()">Create Account</button><button class="btn secondary" onclick="welcome()">Back</button>'))}
function signinForm(m=""){wrap(card('<b>SIGN IN</b><h1>Welcome back</h1>'+m+'<div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="signin()">Sign In</button><button class="btn secondary" onclick="welcome()">Back</button>'))}
async function call(path,opt={}){opt.headers=Object.assign({"apikey":KEY,"Content-Type":"application/json"},opt.headers||{});let r=await fetch(URL+path,opt),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.msg||d.message||d.error_description||d.error||"Request failed");return d}
async function signup(){let n=name.value.trim(),c=company.value.trim(),e=email.value.trim(),p=password.value;if(!n||!c||!e||p.length<8)return signupForm(msg("Complete all fields. Password must be at least 8 characters."));try{let d=await call("/auth/v1/signup",{method:"POST",body:JSON.stringify({email:e,password:p,data:{full_name:n,company_name:c}})});if(d.access_token){save(d);dashboard()}else signinForm(msg("Account created. Confirm your email if requested, then sign in.","good"))}catch(x){signupForm(msg(x.message))}}
async function signin(){try{let d=await call("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:email.value.trim(),password:password.value})});save(d);dashboard()}catch(x){signinForm(msg(x.message))}}
function save(d){localStorage.setItem("sl_token",d.access_token)}
async function rest(path){return call("/rest/v1/"+path,{headers:{Authorization:"Bearer "+localStorage.getItem("sl_token")}})}
async function dashboard(){try{let p=(await rest("profiles?select=*&limit=1"))[0];if(!p)throw Error("Profile not found.");let o=(await rest("organizations?select=*&id=eq."+p.organization_id))[0];let ps=await rest("projects?select=*&active=eq.true");wrap(card('<b>SITELEDGER</b><h1>'+o.name+'</h1><div class="sub">'+p.full_name+' · '+p.role+'</div>'+msg("Connected to the real SiteLedger database.","good")+'<h3>Projects</h3>'+(ps.length?ps.map(x=>'<div class="project"><b>'+x.name+'</b><div class="sub">'+(x.address||"")+'</div></div>').join(""):'<div class="project">No projects yet.</div>')+'<button class="btn secondary" onclick="logout()">Sign Out</button>'))}catch(x){wrap(card(msg(x.message)+'<button class="btn secondary" onclick="logout()">Back to Sign In</button>'))}}
function logout(){localStorage.removeItem("sl_token");welcome()}
window.welcome=welcome;window.signupForm=signupForm;window.signinForm=signinForm;window.signup=signup;window.signin=signin;window.logout=logout;
if(localStorage.getItem("sl_token"))dashboard();else welcome();
</script></body></html>
