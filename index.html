<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>SiteLedger</title>
<style>
:root{--ink:#0b1220;--muted:#667085;--line:#e4e7ec;--bg:#f5f7fb;--blue:#275efe;--blue2:#1747d1;--green:#067647;--greenbg:#ecfdf3;--red:#b42318;--redbg:#fef3f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr}.hero{background:radial-gradient(circle at 15% 0,#24498c 0,#0b1220 42%,#08101e 100%);color:white;padding:52px;display:flex;flex-direction:column;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#4f7cff,var(--blue));display:grid;place-items:center;font-weight:900}.brandname{font-weight:900}.brandsub{font-size:12px;color:#bcc7dc;margin-top:2px}.pitch h1{font-size:48px;line-height:1.02;letter-spacing:-.045em;margin:0 0 16px;max-width:640px}.pitch p{font-size:17px;line-height:1.55;color:#c4cee0;max-width:560px}.point{margin-top:17px;color:#e3e9f4}.panel{display:flex;align-items:center;justify-content:center;padding:32px}.auth{width:min(455px,100%)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#667085;text-transform:uppercase}.auth h2{font-size:32px;letter-spacing:-.035em;margin:7px 0 8px}.lead{color:var(--muted);line-height:1.5;margin-bottom:22px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;border:1px solid #cfd7e3;border-radius:12px;padding:12px 13px;background:#fff;outline:none}.field input:focus{border-color:#7f9cf8;box-shadow:0 0 0 3px rgba(39,94,254,.1)}.btn{width:100%;border:0;border-radius:12px;padding:13px 15px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white}.secondary{background:white;color:var(--ink);border:1px solid #d8dee8;margin-top:9px}.text{background:transparent;color:#475467;margin-top:7px}.notice{border-radius:12px;padding:12px 13px;font-size:13px;margin:12px 0}.error{background:var(--redbg);color:var(--red);border:1px solid #fecdca}.success{background:var(--greenbg);color:var(--green);border:1px solid #abefc6}.appbar{background:linear-gradient(135deg,#0b1220,#182235);color:white;padding:15px 18px}.appwrap{max-width:820px;margin:auto;padding:22px 16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin:11px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:17px;font-weight:850}.small{font-size:13px;color:var(--muted);margin-top:4px}.badge{background:var(--greenbg);color:var(--green);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:850}
@media(max-width:760px){.shell{grid-template-columns:1fr}.hero{display:none}.panel{min-height:100vh;padding:24px}}
</style>
</head>
<body><div id="app"></div>
<script>
const SB='https://zgigfgtujebjvoehbrar.supabase.co';
const KEY='sb_publishable_kmK4_KhS2_erhEw9Sb07uA_N2mOFJKm';
const app=document.getElementById('app');
const A='sl_access',R='sl_refresh';
let token=localStorage.getItem(A)||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
window.onerror=function(m){app.innerHTML='<div class="panel"><div class="auth"><div class="notice error">SiteLedger startup error: '+esc(m)+'</div><button class="btn secondary" onclick="resetSiteLedger()">Reset SiteLedger</button></div></div>'};
function shell(inner){app.innerHTML='<div class="shell"><section class="hero"><div class="brand"><div class="logo">SL</div><div><div class="brandname">SiteLedger</div><div class="brandsub">Construction field management</div></div></div><div class="pitch"><h1>Know what happened on every jobsite.</h1><p>Daily reports, manpower, progress photos, deliveries and field issues in one organized workspace.</p><div class="point">✓ Fast superintendent daily logs</div><div class="point">✓ Project-based team access</div><div class="point">✓ Submitted reports stay locked</div></div><div class="brandsub">SiteLedger beta</div></section><section class="panel"><div class="auth">'+inner+'</div></section></div>'}
function welcome(){shell('<div class="brand" style="margin-bottom:26px"><div class="logo">SL</div><div><div class="brandname">SiteLedger</div><div class="small">Construction Field Management</div></div></div><div class="eyebrow">Welcome</div><h2>Run the field without chasing paperwork.</h2><div class="lead">Create your company workspace or sign in to your existing SiteLedger account.</div><button class="btn primary" onclick="signupForm()">Create Company Account</button><button class="btn secondary" onclick="signinForm()">Sign In</button>')}
function signupForm(msg=''){shell('<div class="eyebrow">New company</div><h2>Create your workspace</h2><div class="lead">The first user becomes the company Owner.</div>'+msg+'<div class="field"><label>Your full name</label><input id="n" autocomplete="name"></div><div class="field"><label>Company name</label><input id="c" autocomplete="organization"></div><div class="field"><label>Email</label><input id="e" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="p" type="password" minlength="8" autocomplete="new-password"></div><button id="sb" class="btn primary" onclick="signup()">Create Company Account</button><button class="btn text" onclick="welcome()">← Back</button>')}
function signinForm(msg=''){shell('<div class="eyebrow">Welcome back</div><h2>Sign in to SiteLedger</h2><div class="lead">Open your company workspace and projects.</div>'+msg+'<div class="field"><label>Email</label><input id="e" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div><button id="ib" class="btn primary" onclick="signin()">Sign In</button><button class="btn text" onclick="welcome()">← Back</button>')}
async function api(path,opt={}){const r=await fetch(SB+path,{...opt,headers:{apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.msg||d.message||d.error_description||d.error||('Request failed '+r.status));return d}
function save(d){if(d.access_token){token=d.access_token;localStorage.setItem(A,d.access_token)}if(d.refresh_token)localStorage.setItem(R,d.refresh_token)}
async function signup(){const n=document.getElementById('n').value.trim(),c=document.getElementById('c').value.trim(),e=document.getElementById('e').value.trim(),p=document.getElementById('p').value;if(!n||!c||!e||p.length<8)return signupForm('<div class="notice error">Complete all fields. Password must be at least 8 characters.</div>');const b=document.getElementById('sb');b.disabled=true;b.textContent='Creating account…';try{const d=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:e,password:p,data:{full_name:n,company_name:c}})});if(d.access_token){save(d);return dashboard()}signinForm('<div class="notice success">Account created. Check your email for confirmation if requested, then sign in.</div>')}catch(x){signupForm('<div class="notice error">'+esc(x.message)+'</div>')}}
async function signin(){const e=document.getElementById('e').value.trim(),p=document.getElementById('p').value;if(!e||!p)return signinForm('<div class="notice error">Enter your email and password.</div>');const b=document.getElementById('ib');b.disabled=true;b.textContent='Signing in…';try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e,password:p})});save(d);dashboard()}catch(x){signinForm('<div class="notice error">'+esc(x.message)+'</div>')}}
async function rest(path){return api('/rest/v1/'+path,{headers:{Authorization:'Bearer '+token}})}
async function dashboard(){try{const ps=await rest('profiles?select=id,full_name,role,organization_id&limit=1');if(!ps.length)throw Error('Your SiteLedger profile was not created.');const p=ps[0];const os=await rest('organizations?select=id,name&id=eq.'+p.organization_id);const o=os[0]||{name:'Company'};const projects=await rest('projects?select=id,name,address&active=eq.true&order=name');app.innerHTML='<div class="appbar"><div style="max-width:820px;margin:auto"><b>SiteLedger</b><div style="font-size:12px;color:#c4cee0">'+esc(o.name)+'</div></div></div><div class="appwrap"><div class="eyebrow">Company dashboard</div><h1>Welcome, '+esc(p.full_name.split(' ')[0])+'.</h1><div class="card"><div class="row"><div><div class="title">'+esc(o.name)+'</div><div class="small">'+esc(p.full_name)+' · '+esc(p.role)+'</div></div><span class="badge">Connected</span></div></div><div class="eyebrow" style="margin-top:22px">Projects</div>'+(projects.length?projects.map(x=>'<div class="card"><div class="title">'+esc(x.name)+'</div><div class="small">'+esc(x.address||'')+'</div></div>').join(''):'<div class="card"><div class="title">No projects yet</div><div class="small">Account creation and the live Supabase connection are working. Next we restore the full field-report workflow.</div></div>')+'<button class="btn secondary" onclick="logout()">Sign Out</button></div>'}catch(x){shell('<div class="notice error">'+esc(x.message)+'</div><button class="btn secondary" onclick="logout()">Back to Sign In</button>')}}
function logout(){localStorage.removeItem(A);localStorage.removeItem(R);token='';welcome()}function resetSiteLedger(){localStorage.removeItem(A);localStorage.removeItem(R);location.reload()}
Object.assign(window,{welcome,signupForm,signinForm,signup,signin,dashboard,logout,resetSiteLedger});
if(token)dashboard();else welcome();
</script></body></html>
