<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>SiteLedger</title>
<style>
:root{
 --bg:#f4f7fb;--surface:#fff;--ink:#0b1220;--muted:#667085;--line:#e5eaf1;
 --nav:#0b1220;--nav2:#182235;--brand:#275efe;--brand2:#1747d1;
 --green:#067647;--greenbg:#ecfdf3;--amber:#b54708;--amberbg:#fff6ed;
 --red:#b42318;--redbg:#fef3f2;--blue:#175cd3;--bluebg:#eff8ff;
 --shadow:0 8px 30px rgba(16,24,40,.07);
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
#app{min-height:100vh}.app{max-width:980px;margin:auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar-inner{height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4f7cff,#275efe);display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.brand-name{font-weight:900;letter-spacing:.01em}.brand-sub{font-size:12px;color:#b8c2d8;margin-top:2px}.user-chip{font-size:12px;color:#e8edf8;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);padding:8px 11px;border-radius:999px}
.page{padding:22px 16px 104px}.hero{margin:3px 0 18px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#667085;text-transform:uppercase}.hero h1{font-size:30px;line-height:1.08;margin:5px 0 5px;letter-spacing:-.03em}.hero p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:11px 0;box-shadow:0 1px 2px rgba(16,24,40,.03)}.card.click:hover{border-color:#d2d9e5;box-shadow:var(--shadow)}.click{cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-weight:850;font-size:17px}.small{font-size:13px;color:var(--muted);margin-top:4px}.section{font-size:11px;font-weight:900;letter-spacing:.12em;color:#667085;margin:24px 2px 9px;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:850;white-space:nowrap}.done{background:var(--greenbg);color:var(--green)}.due{background:var(--amberbg);color:var(--amber)}.past{background:var(--redbg);color:var(--red)}.up{background:#f2f4f7;color:#475467}.progress{background:var(--bluebg);color:var(--blue)}
.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:850;transition:.15s}.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(39,94,254,.18)}.btn.primary:hover{transform:translateY(-1px)}.btn.secondary{background:#fff;color:var(--ink);border:1px solid #d8dee8}.btn.ghost{background:#f2f4f7;color:var(--ink)}.btn.block{width:100%}.btn.smallbtn{padding:9px 11px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #cfd7e3;border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:108px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#7f9cf8;box-shadow:0 0 0 3px rgba(39,94,254,.10)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{border:1px solid var(--line);background:#fbfcfe;border-radius:14px;padding:13px 8px;text-align:center}.metric b{display:block;font-size:21px}.metric span{font-size:11px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}.toggle-title{font-weight:850}.switch{width:50px;height:29px;border-radius:999px;background:#cfd6df;padding:3px;flex:0 0 auto}.switch span{display:block;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.18);transition:.2s}.switch.on{background:var(--brand)}.switch.on span{transform:translateX(21px)}
.inline{border:1px solid var(--line);background:#fafbfc;border-radius:13px;padding:12px;margin:8px 0}.inline-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:850}.inline-sub{font-size:12px;color:var(--muted);margin-top:4px}
.req{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.req:last-child{border-bottom:0}.ok{color:var(--green);font-weight:900}.miss{color:var(--red);font-weight:900}
.notice{border-radius:13px;padding:12px 13px;font-size:13px;margin:10px 0}.notice.info{background:var(--bluebg);color:#1849a9;border:1px solid #b2ddff}.notice.success{background:var(--greenbg);color:var(--green);border:1px solid #abefc6}.notice.warn{background:var(--amberbg);color:var(--amber);border:1px solid #fedf89}.notice.error{background:var(--redbg);color:var(--red);border:1px solid #fecdca}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:50}.navinner{max-width:980px;margin:auto;display:grid}.navbtn{border:0;background:transparent;padding:11px 4px 10px;color:#7a8495;font-size:10px;font-weight:800}.navbtn.active{color:var(--brand)}.navicon{display:block;font-size:19px;margin-bottom:2px}
.auth-shell{min-height:100vh;display:grid;grid-template-columns:1.06fr .94fr;background:#fff}.auth-visual{background:radial-gradient(circle at 10% 0%,#24498c 0,#0b1220 38%,#09101d 100%);color:#fff;padding:52px;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh}.auth-mark{display:flex;align-items:center;gap:11px}.auth-mark .logo{width:44px;height:44px}.auth-copy h1{font-size:46px;line-height:1.02;letter-spacing:-.045em;margin:0 0 16px;max-width:600px}.auth-copy p{font-size:17px;color:#c0cadb;line-height:1.55;max-width:540px}.feature{display:flex;gap:11px;margin-top:17px;color:#dbe3f1;font-size:14px}.feature-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(79,124,255,.18);color:#7fa2ff;flex:0 0 auto}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:34px}.auth-card{width:min(460px,100%)}.auth-card h2{font-size:30px;letter-spacing:-.03em;margin:7px 0}.auth-card .lead{color:var(--muted);line-height:1.5;margin:0 0 22px}.auth-actions{display:grid;gap:9px}.textbtn{border:0;background:transparent;color:#475467;font-weight:800;padding:11px}.textbtn:hover{color:var(--brand)}
.modal{position:fixed;inset:0;background:rgba(9,16,29,.56);display:grid;place-items:end center;z-index:90}.sheet{background:#fff;width:min(700px,100%);border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto;box-shadow:0 -10px 40px rgba(9,16,29,.18)}.sheet h3{margin:0 0 14px;font-size:21px}.sheet-actions{display:flex;gap:9px;margin-top:12px}.sheet-actions .btn{flex:1}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}.photo img{width:100%;height:150px;object-fit:cover;display:block;background:#eef1f5}.photo-meta{padding:9px}.photo-title{font-size:13px;font-weight:850}.photo-sub{font-size:11px;color:var(--muted);margin-top:2px}
.signature{width:100%;height:170px;border:1.5px dashed #98a2b3;border-radius:13px;background:#fff;touch-action:none}
.loader{min-height:100vh;display:grid;place-items:center;background:var(--bg)}.loaderbox{text-align:center;color:var(--muted)}.spin{width:34px;height:34px;border-radius:50%;border:3px solid #dfe5ee;border-top-color:var(--brand);animation:spin .8s linear infinite;margin:auto auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}.readonly{opacity:.82}.empty{text-align:center;padding:28px;color:var(--muted)}.avatar{width:34px;height:34px;border-radius:50%;background:#eef2ff;color:#3046a5;display:grid;place-items:center;font-weight:900}
@media(max-width:760px){.auth-shell{grid-template-columns:1fr}.auth-visual{display:none}.auth-panel{min-height:100vh;padding:24px}.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.user-chip{display:none}.page{padding-top:18px}.hero h1{font-size:27px}.photo-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://zgigfgtujebjvoehbrar.supabase.co';
const SB_KEY='sb_publishable_kmK4_KhS2_erhEw9Sb07uA_N2mOFJKm';
const app=document.getElementById('app');
const ACCESS='sl_access', REFRESH='sl_refresh', INVITE='sl_pending_invite';
let token=localStorage.getItem(ACCESS)||'', refreshToken=localStorage.getItem(REFRESH)||'', profile=null, org=null;
let route={screen:'dashboard',projectId:null,reportId:null};
const inviteParam=new URLSearchParams(location.search).get('invite'); if(inviteParam)localStorage.setItem(INVITE,inviteParam);

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const iso=d=>d.toISOString().slice(0,10), parse=s=>new Date(s+'T12:00:00');
const fmt=(s,o={weekday:'long',month:'short',day:'numeric'})=>parse(s).toLocaleDateString(undefined,o);
const mondayOf=d=>{const x=new Date(d),k=x.getDay();x.setDate(x.getDate()+(k===0?-6:1-k));x.setHours(12,0,0,0);return x}
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x}
const today=new Date(), monday=mondayOf(today), week=[0,1,2,3,4].map(n=>iso(add(monday,n)));
const initials=s=>(s||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();

function showLoading(t='Loading SiteLedger…'){app.innerHTML=`<div class="loader"><div class="loaderbox"><div class="spin"></div>${esc(t)}</div></div>`}
function notice(t,type='error'){return `<div class="notice ${type}">${esc(t)}</div>`}
function authLayout(content){
 app.innerHTML=`<div class="auth-shell">
 <section class="auth-visual"><div class="auth-mark"><div class="logo">SL</div><div><div class="brand-name">SiteLedger</div><div class="brand-sub">Construction field management</div></div></div>
 <div class="auth-copy"><div class="eyebrow" style="color:#8ca8dc">Built for the field</div><h1>Know what happened on every jobsite.</h1><p>Daily reports, manpower, progress photos, deliveries and field issues — organized by project and ready when the office needs them.</p>
 <div class="feature"><span class="feature-dot">✓</span><span>Fast superintendent daily logs</span></div><div class="feature"><span class="feature-dot">✓</span><span>Project-based team access</span></div><div class="feature"><span class="feature-dot">✓</span><span>Submitted reports stay locked and traceable</span></div></div>
 <div class="brand-sub">SiteLedger beta · Secure cloud workspace</div></section>
 <section class="auth-panel"><div class="auth-card">${content}</div></section></div>`;
}
function welcome(){
 const inv=localStorage.getItem(INVITE);
 authLayout(`<div class="auth-mark" style="margin-bottom:24px;color:#0b1220"><div class="logo">SL</div><div><div class="brand-name">SiteLedger</div><div class="small">Construction Field Management</div></div></div>
 <div class="eyebrow">Welcome</div><h2>Run the field without chasing paperwork.</h2><p class="lead">Sign in to your company workspace or create a new SiteLedger account.</p>
 <div class="auth-actions"><button class="btn primary block" onclick="showSignup(false)">Create Company Account</button><button class="btn secondary block" onclick="showSignin()">Sign In</button>${inv?`<button class="btn secondary block" onclick="showSignup(true)">Join Invited Company</button>`:''}</div>`);
}
function showSignup(join=false,msg=''){
 const inv=localStorage.getItem(INVITE);
 authLayout(`<div class="eyebrow">${join?'Team invitation':'New company'}</div><h2>${join?'Join your team':'Create your workspace'}</h2><p class="lead">${join?'Create your login and SiteLedger will connect you to the company that invited you.':'You’ll be the company Owner and can add projects and invite your team.'}</p>${msg}
 <div class="field"><label>Your full name</label><input id="su_name" autocomplete="name" placeholder="Full name"></div>
 ${join?'':`<div class="field"><label>Company name</label><input id="su_company" autocomplete="organization" placeholder="Company name"></div>`}
 <div class="field"><label>Email</label><input id="su_email" type="email" autocomplete="email" placeholder="you@company.com"></div>
 <div class="field"><label>Password</label><input id="su_password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div>
 ${join&&inv?`<div class="notice info">Invitation detected. This account will join the invited company after sign-in.</div>`:''}
 <button id="signup_btn" class="btn primary block" onclick="signup(${join})">${join?'Create Login & Join':'Create Company Account'}</button>
 <button class="textbtn block" onclick="welcome()">← Back</button>`);
}
function showSignin(msg=''){
 authLayout(`<div class="eyebrow">Welcome back</div><h2>Sign in to SiteLedger</h2><p class="lead">Open your projects and field reports.</p>${msg}
 <div class="field"><label>Email</label><input id="si_email" type="email" autocomplete="email" placeholder="you@company.com"></div>
 <div class="field"><label>Password</label><input id="si_password" type="password" autocomplete="current-password" placeholder="Password"></div>
 <button id="signin_btn" class="btn primary block" onclick="signin()">Sign In</button><button class="textbtn block" onclick="welcome()">← Back</button>`);
}

async function call(path,opt={}){
 const headers={apikey:SB_KEY,'Content-Type':'application/json',...(opt.headers||{})};
 const res=await fetch(SB_URL+path,{...opt,headers});
 let data=null; try{data=await res.json()}catch(e){data={}}
 if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||`Request failed (${res.status})`);
 return data;
}
function saveSession(d){if(d.access_token){token=d.access_token;localStorage.setItem(ACCESS,token)}if(d.refresh_token){refreshToken=d.refresh_token;localStorage.setItem(REFRESH,refreshToken)}}
async function signup(join){
 const n=$('su_name')?.value.trim(),c=$('su_company')?.value.trim(),e=$('su_email')?.value.trim(),p=$('su_password')?.value||'';
 if(!n||(!join&&!c)||!e||p.length<8)return showSignup(join,notice('Complete all required fields. Password must be at least 8 characters.'));
 const b=$('signup_btn'); if(b){b.disabled=true;b.textContent='Creating account…'}
 try{
   const meta=join?{full_name:n}:{full_name:n,company_name:c};
   const d=await call('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:e,password:p,data:meta})});
   if(d.access_token){saveSession(d);if(join)await acceptPendingInvite(n);await boot();return}
   showSignin(notice('Account created. Check your email to confirm it, then sign in.','success'));
 }catch(err){showSignup(join,notice(err.message))}
}
async function signin(){
 const e=$('si_email')?.value.trim(),p=$('si_password')?.value||''; if(!e||!p)return showSignin(notice('Enter your email and password.'));
 const b=$('signin_btn'); if(b){b.disabled=true;b.textContent='Signing in…'}
 try{const d=await call('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e,password:p})});saveSession(d);await boot()}
 catch(err){showSignin(notice(err.message))}
}
async function rest(path,opt={}){
 if(!token)throw new Error('Not signed in');
 const headers={Authorization:'Bearer '+token,Prefer:'return=representation',...(opt.headers||{})};
 try{return await call('/rest/v1/'+path,{...opt,headers})}
 catch(err){
   if(err.message.toLowerCase().includes('jwt')&&refreshToken){
     const d=await call('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:refreshToken})});saveSession(d);
     return call('/rest/v1/'+path,{...opt,headers:{...headers,Authorization:'Bearer '+token}})
   } throw err;
 }
}
async function acceptPendingInvite(name){
 const inv=localStorage.getItem(INVITE); if(!inv)return;
 await rest('rpc/accept_company_invite',{method:'POST',body:JSON.stringify({invite_token:inv,person_name:name||''})});
 localStorage.removeItem(INVITE); history.replaceState({},'',location.pathname);
}
function logout(){localStorage.removeItem(ACCESS);localStorage.removeItem(REFRESH);token='';refreshToken='';profile=null;org=null;welcome()}

async function boot(){
 showLoading();
 try{
   let ps=await rest('profiles?select=*&limit=1');
   if(!ps.length&&localStorage.getItem(INVITE)){await acceptPendingInvite('');ps=await rest('profiles?select=*&limit=1')}
   if(!ps.length)throw new Error('Your login is not linked to a SiteLedger company yet.');
   profile=ps[0]; const os=await rest(`organizations?select=*&id=eq.${profile.organization_id}`);org=os[0];
   route.screen='dashboard'; await render();
 }catch(err){authLayout(`${notice(err.message)}<button class="btn secondary block" onclick="logout()">Back to Sign In</button>`)}
}
function nav(active){
 const items=[['dashboard','⌂','Home'],['daily','▦','Daily Logs'],['projects','▣','Projects']];
 if(profile&&['owner','admin'].includes(profile.role))items.push(['team','◎','Team']);
 items.push(['history','◷','History']);
 return `<div class="bottomnav"><div class="navinner" style="grid-template-columns:repeat(${items.length},1fr)">${items.map(i=>`<button class="navbtn ${active===i[0]?'active':''}" onclick="go('${i[0]}')"><span class="navicon">${i[1]}</span>${i[2]}</button>`).join('')}</div></div>`;
}
function top(title,active,body){
 return `<div class="app"><div class="topbar"><div class="topbar-inner"><div class="brand"><div class="logo">SL</div><div><div class="brand-name">${esc(title)}</div><div class="brand-sub">${esc(org?.name||'SiteLedger')}</div></div></div><div class="user-chip">${esc(profile?.full_name||'')}</div></div></div>${body}${nav(active)}</div>`;
}
const page=x=>`<div class="page">${x}</div>`;
window.go=(screen,arg)=>{route.screen=screen;if(screen==='project')route.projectId=arg;if(screen==='report')route.reportId=arg;render()};

async function projects(){return rest('projects?select=*&active=eq.true&order=name')}
async function reports(pid=''){return rest(`daily_reports?select=*${pid?'&project_id=eq.'+pid:''}&order=log_date`)}
async function child(table,rid){return rest(`${table}?select=*&daily_report_id=eq.${rid}`)}
function status(r){if(r.submitted)return['Submitted','done'];const t=iso(today);if(r.log_date>t)return['Upcoming','up'];if(r.log_date===t)return['Due Today','due'];return['Past Due','past']}
async function ensureWeek(p){
 const rs=await reports(p.id);
 for(const d of week)if(!rs.some(r=>r.log_date===d)){
   try{await rest('daily_reports',{method:'POST',body:JSON.stringify({project_id:p.id,log_date:d,created_by:profile.id})})}catch(e){}
 }
}

async function render(){
 showLoading();
 try{
   if(route.screen==='dashboard')await renderDashboard();
   else if(route.screen==='daily')await renderDaily();
   else if(route.screen==='projects')await renderProjects();
   else if(route.screen==='project')await renderProject();
   else if(route.screen==='team')await renderTeam();
   else if(route.screen==='history')await renderHistory();
   else if(route.screen==='report')await renderReport();
 }catch(err){app.innerHTML=top('SiteLedger','',page(notice(err.message)+`<button class="btn secondary block" onclick="render()">Try Again</button>`))}
}
async function renderDashboard(){
 const ps=await projects();for(const p of ps)await ensureWeek(p);const rs=await reports();
 const todayRs=rs.filter(r=>r.log_date===iso(today)),past=rs.filter(r=>!r.submitted&&r.log_date<iso(today)).length,submitted=rs.filter(r=>r.submitted&&week.includes(r.log_date)).length;
 const cards=ps.map(p=>{const r=todayRs.find(x=>x.project_id===p.id),s=r?status(r):['Not Started','up'];return `<div class="card click" onclick="go('project','${p.id}')"><div class="row"><div><div class="title">${esc(p.name)}</div><div class="small">${esc(p.address||'')}</div></div><span class="badge ${s[1]}">${s[0]}</span></div></div>`}).join('');
 app.innerHTML=top('SiteLedger','dashboard',page(`<div class="hero"><div class="eyebrow">Company overview</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, ${esc(profile.full_name.split(' ')[0])}.</h1><p>Here’s what needs attention across your jobsites.</p></div>
 <div class="grid4"><div class="metric"><b>${ps.length}</b><span>Active Projects</span></div><div class="metric"><b>${todayRs.filter(r=>!r.submitted).length}</b><span>Due Today</span></div><div class="metric"><b>${past}</b><span>Past Due</span></div><div class="metric"><b>${submitted}</b><span>Submitted This Week</span></div></div>
 <div class="section">Active Projects</div>${cards||`<div class="card empty">No projects yet.${['owner','admin'].includes(profile.role)?`<br><br><button class="btn primary" onclick="go('projects')">Create Your First Project</button>`:''}</div>`}
 <div class="section">Account</div><button class="btn secondary block" onclick="logout()">Sign Out</button>`));
}
async function renderDaily(){
 const ps=await projects();for(const p of ps)await ensureWeek(p);const rs=await reports();let html='';
 for(const p of ps){
   html+=`<div class="section">${esc(p.name)}</div>`;
   for(const d of week){const r=rs.find(x=>x.project_id===p.id&&x.log_date===d);if(!r)continue;const s=status(r);html+=`<div class="card click" onclick="go('report','${r.id}')"><div class="row"><div><div class="title">${fmt(d).toUpperCase()}</div><div class="small">${esc(p.name)}</div></div><span class="badge ${s[1]}">${s[0]==='Submitted'?'✓ ':''}${s[0]}</span></div></div>`}
 }
 app.innerHTML=top('Daily Logs','daily',page(`<div class="hero"><div class="eyebrow">Field reporting</div><h1>This Week</h1><p>${fmt(week[0],{month:'short',day:'numeric'})} – ${fmt(week[4],{month:'short',day:'numeric',year:'numeric'})}</p></div>${html||`<div class="card empty">No assigned projects.</div>`}`));
}
async function renderProjects(){
 const ps=await projects(),canManage=['owner','admin'].includes(profile.role);

function projectForm(){

async function createProject(){
 const name=$('pf_name')?.value.trim();if(!name)return alert('Enter a project name.');
 await rest('projects',{method:'POST',body:JSON.stringify({organization_id:profile.organization_id,name,address:$('pf_address')?.value.trim()||null,start_date:$('pf_start')?.value||null,target_completion:$('pf_target')?.value||null,active:true,status:'active'})});
 closeModal();await renderProjects();

async function oneReport(){const x=await rest(`daily_reports?select=*&id=eq.${route.reportId}`);return x[0]}

 app.innerHTML=top('Daily Report','',page(`<div class="${ro?'readonly':''}"><div class="hero"><div class="eyebrow">Daily field report</div><h1>${fmt(r.log_date)}</h1><p>${esc(p?.name||'Project')}</p><div style="margin-top:10px"><span class="badge ${s[1]}">${s[0]}</span></div></div>
 ${future?`<div class="notice warn">This report is upcoming and is view-only until the report date.</div>`:''}
 <div class="section">Report Details</div><div class="card"><div class="field"><label>Created By</label><input value="${esc(profile.full_name)}" disabled></div><div class="toggle"><div><div class="toggle-title">No Work Today</div><div class="small">Use this when no work occurred on site.</div></div><div class="switch ${r.no_work_today?'on':''}" onclick="${ro?'':'toggleNoWork()'}"><span></span></div></div></div>

 <div class="section">Work & Manpower</div><div class="card">${field('Work Performed','work_performed',r.work_performed,'textarea','Describe the work completed today…')}${field('Areas / Floors','areas_floors',r.areas_floors,'input','e.g. 5th Floor, Primary Bedroom')}

async function signedPhotoUrl(path){
 const res=await fetch(`${SB_URL}/storage/v1/object/sign/report-photos/${encodeURIComponent(path).replace(/%2F/g,'/')}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});
 if(!res.ok)return '';const d=await res.json();return d.signedURL?SB_URL+'/storage/v1'+d.signedURL:'';
}

async function savePhoto(){
 const f=$('p_file')?.files?.[0];if(!f)return alert('Choose a photo.');
 const b=$('photo_save');b.disabled=true;b.textContent='Uploading…';const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${profile.organization_id}/${route.reportId}/${Date.now()}_${safe}`;
 const res=await fetch(`${SB_URL}/storage/v1/object/report-photos/${path}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+token,'Content-Type':f.type||'application/octet-stream','x-upsert':'false'},body:f});
 if(!res.ok){b.disabled=false;b.textContent='Upload Photo';return alert('Photo upload failed.')}
 await rest('photos',{method:'POST',body:JSON.stringify({daily_report_id:route.reportId,storage_path:path,caption:$('p_caption').value.trim()||null,area_floor:$('p_area').value.trim()||null,trade:$('p_trade').value.trim()||null,uploaded_by:profile.id})});closeModal();renderReport();

let sigCanvas=null,sigCtx=null,drawing=false;
function setupSignature(){
 sigCanvas=$('sig');if(!sigCanvas)return;const ratio=devicePixelRatio||1,rect=sigCanvas.getBoundingClientRect();sigCanvas.width=rect.width*ratio;sigCanvas.height=170*ratio;sigCtx=sigCanvas.getContext('2d');sigCtx.scale(ratio,ratio);sigCtx.lineWidth=2;sigCtx.lineCap='round';sigCtx.strokeStyle='#0b1220';
 const pos=e=>{const r=sigCanvas.getBoundingClientRect(),t=e.touches?.[0]||e;return[t.clientX-r.left,t.clientY-r.top]};
 const start=e=>{drawing=true;sigCtx.beginPath();sigCtx.moveTo(...pos(e));e.preventDefault()},move=e=>{if(!drawing)return;sigCtx.lineTo(...pos(e));sigCtx.stroke();e.preventDefault()},end=e=>{drawing=false;e.preventDefault()};
 sigCanvas.addEventListener('mousedown',start);sigCanvas.addEventListener('mousemove',move);window.addEventListener('mouseup',end);sigCanvas.addEventListener('touchstart',start,{passive:false});sigCanvas.addEventListener('touchmove',move,{passive:false});sigCanvas.addEventListener('touchend',end,{passive:false});
}
function clearSignature(){if(sigCtx&&sigCanvas)sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height)}
async function saveSignature(){if(!sigCanvas)return;await updateReport({signature_path:sigCanvas.toDataURL('image/png')});renderReport()}
async function submitReport(){if(!confirm('Submit this Daily Report? It will become read-only.'))return;await updateReport({submitted:true,submitted_at:new Date().toISOString()});renderReport()}
