<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>SiteLedger</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7fb;color:#101828}button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.hero{background:linear-gradient(145deg,#0b1220,#17233a);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:18px}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#4f7cff,#275efe);display:grid;place-items:center;color:#fff;font-weight:900}.hero h1{font-size:48px;line-height:1.02;letter-spacing:-.04em;max-width:580px;margin:0 0 18px}.hero p{color:#c5d0e3;font-size:17px;line-height:1.55;max-width:540px}.feature{margin:15px 0;color:#e5eaf4}.panel{display:flex;align-items:center;justify-content:center;padding:36px;background:#fff}.card{width:min(460px,100%)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#667085}.card h2{font-size:32px;letter-spacing:-.03em;margin:7px 0}.lead{color:#667085;line-height:1.5;margin:0 0 24px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:12px;outline:none}.field input:focus{border-color:#7594ff;box-shadow:0 0 0 3px #eef2ff}.btn{width:100%;padding:13px 15px;border-radius:12px;font-weight:850;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#275efe,#1747d1);color:#fff}.secondary{margin-top:9px;background:#fff;border:1px solid #d0d5dd;color:#101828}.text{border:0;background:transparent;color:#475467;margin-top:8px}.notice{padding:12px 13px;border-radius:12px;margin:12px 0;font-size:13px}.error{background:#fef3f2;color:#b42318;border:1px solid #fecdca}.success{background:#ecfdf3;color:#067647;border:1px solid #abefc6}.app{max-width:920px;margin:auto;padding:28px 18px}.top{background:#0b1220;color:#fff;padding:16px 18px}.topin{max-width:920px;margin:auto;display:flex;align-items:center;justify-content:space-between}.box{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.muted{color:#667085;font-size:13px}.badge{font-size:12px;font-weight:800;background:#ecfdf3;color:#067647;padding:7px 10px;border-radius:999px}.loading{min-height:100vh;display:grid;place-items:center;color:#667085}@media(max-width:760px){.shell{grid-template-columns:1fr}.hero{display:none}.panel{min-height:100vh;padding:24px}.card h2{font-size:29px}}
</style></head><body><div id="app"></div>
<script>
(function(){
'use strict';
var URL='https://zgigfgtujebjvoehbrar.supabase.co';
var KEY='sb_publishable_kmK4_KhS2_erhEw9Sb07uA_N2mOFJKm';
var app=document.getElementById('app');
var ACCESS='siteledger_access';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function note(t,type){return '<div class="notice '+(type||'error')+'">'+esc(t)+'</div>'}
function layout(content){app.innerHTML='<div class="shell"><section class="hero"><div class="brand"><div class="logo">SL</div>SiteLedger</div><div><div class="eyebrow" style="color:#8ca8dc">Built for the field</div><h1>Know what happened on every jobsite.</h1><p>Daily reports, manpower, progress photos, deliveries and field issues — organized by project and ready when the office needs them.</p><div class="feature">✓ Fast superintendent daily logs</div><div class="feature">✓ Project-based team access</div><div class="feature">✓ Submitted reports stay traceable</div></div><div class="muted" style="color:#9eabc1">SiteLedger beta · Secure cloud workspace</div></section><section class="panel"><div class="card">'+content+'</div></section></div>'}
function welcome(){layout('<div class="brand" style="color:#101828;margin-bottom:24px"><div class="logo">SL</div>SiteLedger</div><div class="eyebrow">Welcome</div><h2>Construction field management.</h2><p class="lead">Create your company workspace or sign in to continue.</p><button class="btn primary" id="create">Create Company Account</button><button class="btn secondary" id="signin">Sign In</button>');document.getElementById('create').onclick=function(){signupForm()};document.getElementById('signin').onclick=function(){signinForm()}}
function signupForm(msg){layout('<div class="eyebrow">New company</div><h2>Create your workspace</h2><p class="lead">The first user becomes the company Owner.</p>'+(msg||'')+'<div class="field"><label>Your full name</label><input id="name" autocomplete="name"></div><div class="field"><label>Company name</label><input id="company" autocomplete="organization"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" autocomplete="new-password"></div><button class="btn primary" id="submit">Create Company Account</button><button class="btn text" id="back">← Back</button>');document.getElementById('submit').onclick=signup;document.getElementById('back').onclick=welcome}
function signinForm(msg){layout('<div class="eyebrow">Welcome back</div><h2>Sign in to SiteLedger</h2><p class="lead">Open your company workspace and projects.</p>'+(msg||'')+'<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" id="submit">Sign In</button><button class="btn text" id="back">← Back</button>');document.getElementById('submit').onclick=signin;document.getElementById('back').onclick=welcome}
async function request(path,options){options=options||{};options.headers=Object.assign({'apikey':KEY,'Content-Type':'application/json'},options.headers||{});var r=await fetch(URL+path,options);var d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||('Request failed ('+r.status+')'));return d}
async function signup(){var n=document.getElementById('name').value.trim(),c=document.getElementById('company').value.trim(),e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!n||!c||!e||p.length<8){signupForm(note('Complete all fields. Password must be at least 8 characters.'));return}try{var b=document.getElementById('submit');b.disabled=true;b.textContent='Creating account…';var d=await request('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:e,password:p,data:{full_name:n,company_name:c}})});if(d.access_token){localStorage.setItem(ACCESS,d.access_token);dashboard();return}signinForm(note('Account created. If confirmation is enabled, check your email, then sign in.','success'))}catch(err){signupForm(note(err.message))}}
async function signin(){var e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!e||!p){signinForm(note('Enter your email and password.'));return}try{var b=document.getElementById('submit');b.disabled=true;b.textContent='Signing in…';var d=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e,password:p})});localStorage.setItem(ACCESS,d.access_token);dashboard()}catch(err){signinForm(note(err.message))}}
async function rest(path){var t=localStorage.getItem(ACCESS);return request('/rest/v1/'+path,{headers:{Authorization:'Bearer '+t}})}
async function dashboard(){app.innerHTML='<div class="loading">Loading SiteLedger…</div>';try{var profiles=await rest('profiles?select=*&limit=1');if(!profiles.length)throw new Error('Your account was created, but the company profile was not created. Please tell me and I will fix the backend trigger.');var p=profiles[0];var orgs=await rest('organizations?select=*&id=eq.'+p.organization_id);var o=orgs[0]||{name:'Your Company'};var projects=await rest('projects?select=*&active=eq.true&order=name');app.innerHTML='<div class="top"><div class="topin"><div class="brand"><div class="logo">SL</div>SiteLedger</div><div>'+esc(p.full_name||'')+'</div></div></div><main class="app"><div class="eyebrow">Company dashboard</div><h1>'+esc(o.name)+'</h1><p class="muted">Your SiteLedger workspace is connected and ready for project setup.</p><div class="box"><div class="row"><div><b>Account connected</b><div class="muted">Role: '+esc(p.role||'Owner')+'</div></div><span class="badge">Connected</span></div></div><h3>Projects</h3>'+(projects.length?projects.map(function(x){return '<div class="box"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.address||'')+'</div></div>'}).join(''):'<div class="box"><b>No projects yet</b><div class="muted">Account creation is working. Project creation and the full Daily Log workflow are the next screen set to validate.</div></div>')+'<button class="btn secondary" id="logout">Sign Out</button></main>';document.getElementById('logout').onclick=function(){localStorage.removeItem(ACCESS);welcome()}}catch(err){localStorage.removeItem(ACCESS);signinForm(note(err.message))}}
window.addEventListener('error',function(e){app.innerHTML='<div class="loading"><div>'+note('SiteLedger startup error: '+e.message)+'</div></div>'});
if(localStorage.getItem(ACCESS)){dashboard()}else{welcome()}
})();
</script></body></html>
